name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Windows / Python 3.11
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0,<9"

      - name: Byte-compile sources
        run: python -m compileall -q main.py app_paths.py config core output ui tests

      - name: Run pytest smoke and P0 regression tests
        env:
          PYTHONUTF8: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_smoke.py tests/test_p0.py -q

      - name: Run full test suite
        env:
          PYTHONUTF8: "1"
        run: python tests/comprehensive_test.py
